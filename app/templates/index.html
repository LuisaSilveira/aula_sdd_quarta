<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listas de compras</title>
  </head>
  <body>
    {% for mensagem in get_flashed_messages() %}
      <p role="alert">{{ mensagem }}</p>
    {% endfor %}

    <main>
      <h1>Listas ativas</h1>

      <form action="{{ url_for('criar') }}" method="post">
        <label for="nome">Nome da lista</label>
        <input id="nome" name="nome" type="text" required>
        <button type="submit">Criar lista</button>
      </form>

      {% if listas %}
        <ul>
          {% for lista in listas %}
            <li>
              <strong>{{ lista.nome }}</strong>
              <form action="{{ url_for('renomear', lista_id=lista.id) }}" method="post">
                <label for="nome-{{ lista.id }}">Novo nome</label>
                <input id="nome-{{ lista.id }}" name="nome" type="text" value="{{ lista.nome }}" required>
                <button type="submit">Renomear</button>
              </form>
              <form action="{{ url_for('excluir', lista_id=lista.id) }}" method="post"
                    onsubmit="return confirm('Excluir esta lista ativa?');">
                <input type="hidden" name="confirmar" value="sim">
                <button type="submit">Excluir</button>
              </form>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>Nenhuma lista ativa. Crie sua primeira lista.</p>
      {% endif %}
    </main>
  </body>
</html>
